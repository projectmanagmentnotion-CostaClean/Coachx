<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AthlexForce - Hydration Frequency</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#121212",
                        "inverse-surface": "#e0e5cf",
                        "on-tertiary": "#243141",
                        "surface-container-high": "#272c1d",
                        "surface-variant": "#323728",
                        "surface-container-low": "#191d10",
                        "on-surface": "#e0e5cf",
                        "primary-fixed": "#b1f800",
                        "on-primary-container": "#4d6e00",
                        "secondary-container": "#95c600",
                        "on-primary": "#243600",
                        "on-primary-fixed": "#131f00",
                        "background": "#050505",
                        "inverse-primary": "#486800",
                        "tertiary-fixed": "#d6e4f8",
                        "surface-container-highest": "#323728",
                        "outline": "rgba(247, 247, 247, 0.1)",
                        "on-primary-fixed-variant": "#354e00",
                        "on-tertiary-fixed-variant": "#3a4858",
                        "primary": "#ffffff",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-fixed": "#0f1c2b",
                        "surface-container-lowest": "#0b1005",
                        "on-secondary-container": "#394e00",
                        "secondary-fixed-dim": "#a5d71f",
                        "surface-dim": "#101508",
                        "on-error": "#690005",
                        "error-container": "#93000a",
                        "on-surface-variant": "#c2caad",
                        "surface-container": "#1d2114",
                        "primary-container": "#b1f800",
                        "on-secondary": "#263500",
                        "outline-variant": "#424a33",
                        "inverse-on-surface": "#2d3223",
                        "warning": "#FFB020",
                        "on-secondary-fixed": "#151f00",
                        "on-secondary-fixed-variant": "#394d00",
                        "tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#bac8dc",
                        "tertiary-container": "#d6e4f8",
                        "error": "#FF4D4F",
                        "on-tertiary-container": "#586577",
                        "secondary-fixed": "#c0f43f",
                        "surface-tint": "#9bd900",
                        "on-background": "#e0e5cf",
                        "surface-bright": "#363b2c",
                        "secondary": "#b0e32d",
                        "primary-fixed-dim": "#9bd900"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "stack-lg": "24px",
                        "margin-mobile": "16px",
                        "gutter": "12px",
                        "touch-target": "44px"
                    },
                    "fontFamily": {
                        "headline-md": ["Hanken Grotesk"],
                        "label-lg": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "display-metrics": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "label-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-metrics": ["48px", { "lineHeight": "48px", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #050505; color: #ffffff; }
        .interactive-zone { min-height: 44px; display: flex; align-items: center; }
        
        .radio-custom:checked + div {
            border-color: #B6FF00;
            background-color: #1A1A1A;
        }
        .radio-custom:checked + div .check-icon {
            opacity: 1;
        }
        
        /* Smooth, non-bouncy transitions */
        .transition-controlled {
            transition-property: all;
            transition-duration: 150ms;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col font-sans">
<!-- TopAppBar -->
<header class="bg-background dark:bg-background border-b border-outline flex justify-between items-center px-margin-mobile h-touch-target w-full z-50 sticky top-0">
<div class="flex items-center gap-4">
<!-- Simulated Back Button for deep link -->
<button class="interactive-zone text-on-surface-variant hover:text-primary transition-controlled active:scale-95">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary tracking-tighter">HYDRATION</h1>
</div>
<div class="flex gap-2 text-on-surface-variant">
<button aria-label="Settings" class="interactive-zone p-2 hover:bg-surface-container-high transition-colors duration-100 rounded-full">
<span class="material-symbols-outlined">settings</span>
</button>
<button aria-label="Help" class="interactive-zone p-2 hover:bg-surface-container-high transition-colors duration-100 rounded-full">
<span class="material-symbols-outlined">help_outline</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 w-full max-w-md mx-auto px-margin-mobile py-stack-lg flex flex-col gap-stack-lg">
<section>
<h2 class="font-label-lg text-label-lg text-on-surface-variant mb-stack-sm uppercase">Reminder Frequency</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-md">Select how often you want to receive hydration alerts during active periods.</p>
<div class="flex flex-col gap-stack-sm">
<!-- Option: OFF (Unselected) -->
<label class="relative cursor-pointer group">
<input class="sr-only radio-custom" name="hydration_freq" type="radio" value="off"/>
<div class="bg-surface rounded-lg border border-outline p-4 interactive-zone justify-between transition-controlled group-hover:border-on-surface-variant group-active:bg-surface-container-high">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant">notifications_off</span>
<span class="font-body-lg text-body-lg text-primary">OFF</span>
</div>
<span class="material-symbols-outlined text-primary-fixed opacity-0 check-icon transition-opacity duration-150">check_circle</span>
</div>
</label>
<!-- Option: EVERY 2 HOURS (Selected) -->
<label class="relative cursor-pointer group">
<input checked="" class="sr-only radio-custom" name="hydration_freq" type="radio" value="2h"/>
<div class="bg-surface rounded-lg border border-outline p-4 interactive-zone justify-between transition-controlled group-hover:border-on-surface-variant group-active:bg-surface-container-high">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary-fixed">timer</span>
<span class="font-body-lg text-body-lg text-primary">EVERY 2 HOURS</span>
</div>
<span class="material-symbols-outlined text-primary-fixed opacity-0 check-icon transition-opacity duration-150" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</label>
<!-- Option: EVERY 3 HOURS (Unselected) -->
<label class="relative cursor-pointer group">
<input class="sr-only radio-custom" name="hydration_freq" type="radio" value="3h"/>
<div class="bg-surface rounded-lg border border-outline p-4 interactive-zone justify-between transition-controlled group-hover:border-on-surface-variant group-active:bg-surface-container-high">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant">timer</span>
<span class="font-body-lg text-body-lg text-primary">EVERY 3 HOURS</span>
</div>
<span class="material-symbols-outlined text-primary-fixed opacity-0 check-icon transition-opacity duration-150">check_circle</span>
</div>
</label>
<!-- Option: CUSTOM (Disabled) -->
<label class="relative cursor-not-allowed opacity-50">
<input class="sr-only" disabled="" name="hydration_freq" type="radio" value="custom"/>
<div class="bg-surface rounded-lg border border-outline p-4 interactive-zone justify-between flex-col items-start gap-1">
<div class="flex items-center gap-3 w-full">
<span class="material-symbols-outlined text-on-surface-variant">tune</span>
<span class="font-body-lg text-body-lg text-primary">CUSTOM</span>
<span class="material-symbols-outlined ml-auto text-on-surface-variant">lock</span>
</div>
<span class="font-label-md text-label-md text-error ml-9">IMPLEMENT ONLY IF SUPPORTED</span>
</div>
</label>
</div>
</section>
<!-- Decorative Tech Element / Spacer -->
<div class="mt-auto pt-stack-lg flex justify-center opacity-20">
<div class="w-16 h-1 bg-outline rounded-full"></div>
</div>
</main>
<!-- BottomNavBar Suppressed as this is a detail/settings view -->
</body></html>
