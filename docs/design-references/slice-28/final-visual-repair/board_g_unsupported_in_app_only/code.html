<button class="w-touch-target h-touch-target flex items-center justify-center text-primary hover:bg-surface-container-high transition-colors duration-100 rounded-full active:scale-95">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>

        </div>

<button class="w-touch-target h-touch-target flex items-center justify-center text-primary hover:bg-surface-container-high transition-colors duration-100 rounded-full active:scale-95">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
<button class="w-touch-target h-touch-target flex items-center justify-center text-primary hover:bg-surface-container-high transition-colors duration-100 rounded-full active:scale-95">
<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
</button>
</div>

<!-- Background atmospheric effect (subtle) -->

<div class="w-24 h-24 rounded-full bg-surface border border-outline flex items-center justify-center mb-4 relative shadow-[0_0_30px_rgba(247,247,247,0.05)]">
<span class="material-symbols-outlined filled text-on-surface-variant text-5xl" data-icon="desktop_access_disabled">desktop_access_disabled</span>
<!-- Small badge indicating the device context -->
<div class="absolute -bottom-2 -right-2 w-10 h-10 bg-background rounded-full border border-outline flex items-center justify-center">
<span class="material-symbols-outlined text-secondary text-xl" data-icon="smartphone">smartphone</span>
</div>
</div>
<div class="flex flex-col gap-stack-sm">
<!-- Title -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary uppercase">
                    BROWSER NOTIFICATIONS AREN'T AVAILABLE HERE
                </h1>
<!-- Explanation -->
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[320px] mx-auto">
                    The athlete can still receive reminders inside AthlexForce.
                </p>
</div>
<!-- Status Indicator (IN_APP_ONLY) -->
<div class="bg-surface px-4 py-2 rounded-lg border border-outline flex items-center gap-2 mt-4">
<div class="w-2 h-2 rounded-full bg-warning animate-pulse"></div>
<span class="font-label-lg text-label-lg text-on-surface uppercase tracking-wider">Status: IN_APP_ONLY</span>
</div>
<!-- Actions Container -->
<div class="flex flex-col w-full gap-stack-md mt-stack-lg">
<!-- Primary CTA -->
<button class="w-full h-touch-target bg-primary-container text-on-primary-container font-label-lg text-label-lg uppercase rounded-lg hover:bg-surface-tint active:scale-95 transition-all duration-100 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="notifications_active">notifications_active</span>
                    USE IN-APP REMINDERS
                </button>
<!-- Secondary CTA -->
<button class="w-full h-touch-target bg-transparent border border-outline border-opacity-40 text-primary font-label-lg text-label-lg uppercase rounded-lg hover:bg-surface-container-high active:scale-95 transition-all duration-100 flex items-center justify-center">

                </button>
